figures:
  - id: fig01
    stem: fig01_study_area_samples
    title: Study area and sample distribution
    role: data_map
    status: keep_current
    source: aligned supervised sample table and western-core state boundary
    claim: Defines the spatial scope and the positive, hard-negative, and neutral samples.
    note: Keep this data-driven map unless sample rules change.

  - id: fig02
    stem: fig02_spatial_feature_construction
    title: Spatial feature construction
    role: workflow
    status: redraw
    source: feature alignment scripts and data schema
    claim: Shows how multi-source point, raster, vector, and climate layers become one feature vector.
    note: Redraw as a clean mechanism-style diagram with fewer labels and stronger visual grouping.

  - id: fig03
    stem: fig03_climate_modified_observation_chain
    title: Climate-modified observation chain
    role: mechanism
    status: redraw
    source: method formulation
    claim: Climate modifies observed surface expressions rather than defining deposit labels directly.
    note: Use a compact causal-style chain with climate as an observation modifier.

  - id: fig04
    stem: fig04_experimental_protocol
    title: State-grouped evaluation protocol
    role: protocol
    status: redraw
    source: model training and residualization scripts
    claim: Selection, residualization, training, and scoring are done within each training fold.
    note: Must highlight no validation leakage.

  - id: fig_method
    stem: fig_method_cdmpm_overview
    title: CD-MPM overview
    role: method_overview
    status: redraw
    source: method section
    claim: Summarizes climate sensitivity graph construction and selective residualization.
    note: Should become the main method figure.

  - id: fig05
    stem: fig05_climate_perturbation
    title: Climate perturbation robustness
    role: result
    status: style_refactor_started
    source: outputs/paper_optimization/final_main_experiment
    claim: Compares score sensitivity under climate perturbations.
    note: Already converted to the shared style module as a template for other result figures.

  - id: fig06
    stem: fig06_climate_sensitivity_graph
    title: Climate sensitivity graph
    role: result_mechanism
    status: redraw
    source: climate-sensitive feature selection outputs
    claim: Shows selected climate-feature associations and feature categories.
    note: Should avoid calling every edge a causal effect; label as stable association or graph-guided sensitivity.

  - id: fig07
    stem: fig07_shap_explanation
    title: SHAP explanation
    role: explanation
    status: redraw
    source: trained model explanation outputs
    claim: Shows which feature groups drive the strongest predictions.
    note: Use only if underlying SHAP values are reproducible from saved model outputs.
